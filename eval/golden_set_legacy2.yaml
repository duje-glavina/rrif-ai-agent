# Golden evaluation set for the RRiF AI Agent — v2.
#
# v2 changes:
#   - Expanded from 7 to 28 questions
#   - Coverage of all 16 DB categories (weighted by chunk volume)
#   - New field: expected_category   — for classifier-routing accuracy
#   - New field: expected_keywords    — for answer-content grading on
#                                       questions where article numbers
#                                       don't apply (magazine articles)
#
# Grading signals (handled by run_eval.py):
#   expected_articles  : list[str]   article numbers that should appear in
#                                    top-k retrieval (for law chunks only)
#   expected_keywords  : list[str]   substrings that should appear in the
#                                    generated answer (for any chunk type)
#   expected_category  : str         the category the classifier should
#                                    output (separate from retrieval grading)
#   in_corpus          : bool        true if the answer exists in the KB
#
# Conventions:
#   - Use [] for expected_articles when the answer comes from magazine
#     articles rather than numbered laws.
#   - expected_keywords is best-effort — keep to 2-4 distinctive terms,
#     case-insensitive substring match.
#   - expected_category is the single best-fit category. If the classifier
#     legitimately could pick two, the prompt itself should be updated
#     to disambiguate, not the eval.

# ─── PDV (Law text — clean article-number grading) ─────────────────────────

- id: pdv_001
  query: "Kolika je opća stopa PDV-a?"
  expected_articles: ["38"]
  expected_keywords: ["25%"]
  expected_category: PDV
  in_corpus: true
  notes: "Baseline. Single-article answer."

- id: pdv_002
  query: "Koja je porezna osnovica kod uvoza dobara?"
  expected_articles: ["35"]
  expected_keywords: ["carinska vrijednost"]
  expected_category: PDV
  in_corpus: true
  notes: "Tests discrimination from Članak 34 (adjacent topic)."

- id: pdv_003
  query: "Što su porezni obveznici i tko nije porezni obveznik?"
  expected_articles: ["6"]
  expected_keywords: ["gospodarsku djelatnost"]
  expected_category: PDV
  in_corpus: true
  notes: "Definition question. Članak 6 spans multiple chunks."

- id: pdv_004
  query: "Kada se PDV obračunava po sniženoj stopi?"
  expected_articles: ["38"]
  expected_keywords: ["5%", "13%"]
  expected_category: PDV
  in_corpus: true
  notes: "Tests discrimination from Članak 37 (adjacent but wrong)."

- id: pdv_005_paraphrase
  query: "Koliki je standardni postotak PDV-a u Hrvatskoj?"
  expected_articles: ["38"]
  expected_keywords: ["25%"]
  expected_category: PDV
  in_corpus: true
  notes: "Paraphrase of pdv_001. Tests semantic robustness."

- id: pdv_006_deadline
  query: "Koji je rok za predaju PDV obrasca?"
  expected_articles: ["85"]
  expected_keywords: ["20"]
  expected_category: PDV
  in_corpus: true
  notes: "From benchmark.py — known good question."

