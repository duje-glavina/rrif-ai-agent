# Golden evaluation set for the RRiF AI Agent — v3.
#
# v3 changes:
#   - expected_category updated to new two-level taxonomy subdomain values
#   - Old flat names replaced: "radno pravo" → "radno_pravo", etc.
#   - "novi propisi" category retired — trap_002 now expected "ostalo"
#   - in_corpus flags reviewed against actual corpus content post-reclassification
#
# Subdomain values must match rag/taxonomy.py VALID_SUBDOMAINS exactly:
#   porezi domain:        PDV | dohodak | dobit | paušal | porezi
#   računovodstvo domain: knjiženje | plaće | revizija | fin_izv | računovodstvo
#   pravo domain:         radno_pravo | trg_pravo | inozemstvo | EU_propisi | pravo
#   ostalo domain:        proračun | NPO | tržište | upravljanje | stručne | ostalo

